pipeline:
  name: uat_pipeline
  identifier: uat_pipeline
  projectIdentifier: SonarQube_Test_Project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Multi_Branch_Connector
        build: <+input>
  stages:
    - stage:
        name: uat_stage_1
        identifier: uat_stage_1
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: uat_step_1
                  identifier: uat_step_1
                  spec:
                    shell: Sh
                    command: |-
                      echo "Hello from the UAT pipeline"
                      echo <+pipeline.branch>
                      echo <+pipeline.sequenceId>
